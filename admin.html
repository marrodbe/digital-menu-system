<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 30px;
    }

    h1, h2 {
      margin-bottom: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    input, select {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 12px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      background: #0a84ff;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #006be6;
    }
  </style>
</head>

<body>

<h1>Admin Panel</h1>

<button onclick="addNew()">+ Add Cocktail</button>

<h2>Screen Control</h2>
<div id="screens-control"></div>

<div id="list"></div>

<script>

const SUPABASE_URL = "https://yuoeunioviahidgmyutr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1b2V1bmlvdmlhaGlkZ215dXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjM4MDAsImV4cCI6MjA5NDE5OTgwMH0.IVGtXHt1C_9ZYymNjrrcKscP-VthrvkZH3U_rQU9Vjk";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );



// 🔹 LOAD COCKTAILS
async function loadCocktails() {

  const { data } =
    await supabaseClient
      .from("cocktails")
      .select("*")
      .order("id", { ascending: true });

  const container =
    document.getElementById("list");

  container.innerHTML = "";

  data.forEach(c => {

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <label>Name</label>
      <input value="${c.name || ""}" id="name-${c.id}">

      <label>Description</label>
      <input value="${c.description || ""}" id="desc-${c.id}">

      <label>Price</label>
      <input value="${c.price || ""}" id="price-${c.id}">

      <label>Image URL</label>
      <input 
        value="${c.image || ""}" 
        id="img-${c.id}"
        oninput="updatePreview(${c.id})"
      >

      <input type="file" onchange="uploadImage(event, ${c.id})">

      <label>Preview</label>
      <img 
        id="preview-${c.id}"
        src="${c.image || ""}" 
        style="
          width:120px;
          height:120px;
          object-fit:cover;
          border-radius:8px;
          display:block;
        "
      >

      <label>Screen</label>
      <select id="screen-${c.id}">
        <option ${c.screen === "pubfelix" ? "selected" : ""}>pubfelix</option>
        <option ${c.screen === "pasillo" ? "selected" : ""}>pasillo</option>
        <option ${c.screen === "futbolin" ? "selected" : ""}>futbolin</option>
        <option ${c.screen === "cocina" ? "selected" : ""}>cocina</option>
      </select>

      <button onclick="save(${c.id})">Save</button>
      <button onclick="removeItem(${c.id})" style="background:red;margin-left:10px;">Delete</button>
    `;

    container.appendChild(div);
  });
}



// 🔹 UPDATE PREVIEW LIVE
function updatePreview(id) {

  const input =
    document.getElementById(`img-${id}`);

  const preview =
    document.getElementById(`preview-${id}`);

  if (!preview) return;

  preview.src = input.value;
}



// 🔹 UPLOAD IMAGE (FIX LATER IF NEEDED)
async function uploadImage(event, id) {

  const file = event.target.files[0];

  if (!file) return;

  const fileName =
    Date.now() + "-" + file.name;

  const { error } =
    await supabaseClient
      .storage
      .from("menu-images")
      .upload(fileName, file);

  if (error) {
    alert("Upload failed");
    console.log(error);
    return;
  }

  const { data } =
    supabaseClient
      .storage
      .from("menu-images")
      .getPublicUrl(fileName);

  document.getElementById(`img-${id}`).value =
    data.publicUrl;

  updatePreview(id);
}



// 🔹 SAVE COCKTAIL
async function save(id) {

  const name =
    document.getElementById(`name-${id}`).value;

  const description =
    document.getElementById(`desc-${id}`).value;

  const price =
    document.getElementById(`price-${id}`).value;

  const image =
    document.getElementById(`img-${id}`).value;

  const screen =
    document.getElementById(`screen-${id}`).value;

  await supabaseClient
    .from("cocktails")
    .update({
      name,
      description,
      price,
      image,
      screen,
    })
    .eq("id", id);

  alert("Saved!");
}



// 🔹 DELETE
async function removeItem(id) {

  if (!confirm("Delete this cocktail?")) return;

  await supabaseClient
    .from("cocktails")
    .delete()
    .eq("id", id);

  loadCocktails();
}



// 🔹 ADD NEW
async function addNew() {

  await supabaseClient
    .from("cocktails")
    .insert({
      name: "New Cocktail",
      description: "",
      price: "",
      image: "",
      screen: "pubfelix",
    });

  loadCocktails();
}



// 🔹 LOAD SCREENS
async function loadScreens() {

  const { data } =
    await supabaseClient
      .from("screens")
      .select("*");

  const container =
    document.getElementById("screens-control");

  container.innerHTML = "";

  data.forEach(s => {

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <h3>${s.name}</h3>

      <label>Layout</label>
      <select id="layout-${s.name}">
        <option ${s.active_layout === "hero" ? "selected" : ""}>hero</option>
        <option ${s.active_layout === "grid" ? "selected" : ""}>grid</option>
        <option ${s.active_layout === "food" ? "selected" : ""}>food</option>
      </select>

      <button onclick="saveScreen('${s.name}')">
        Save
      </button>
    `;

    container.appendChild(div);
  });
}



// 🔹 SAVE SCREEN CONFIG
async function saveScreen(name) {

  const layout =
    document.getElementById(`layout-${name}`).value;

  await supabaseClient
    .from("screens")
    .update({
      active_layout: layout
    })
    .eq("name", name);

  alert("Screen updated!");
}



// 🔹 INIT
loadCocktails();
loadScreens();

</script>

</body>
</html>
