<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distrito Carmen Menu Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="menu-container">

        <!-- Background Image -->
        <img id="cocktail-image-a" class="cocktail-image active" src="" alt="">
        <img id="cocktail-image-b" class="cocktail-image" src="" alt="">

        <!-- Background Video -->
        <video
            id="background-video"
            autoplay
            muted
            loop
            playsinline>
        </video>

        <!-- Overlay -->
        <div class="overlay"></div>

        <!-- Logo 
        <div class="logo">
            <img src="https://yuoeunioviahidgmyutr.supabase.co/storage/v1/object/public/menu-images/logos%20venues.png"
                alt="Venue Logo">
        </div> -->

        <!-- Content -->
        <div class="menu-content">
            <h1 id="cocktail-name"></h1>
            <p id="cocktail-description"></p>
            <div id="cocktail-price"></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

    </div>

    <!-- Grid Layout -->
    <div id="grid-layout"></div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/player.js"></script>

</body>

</html>
