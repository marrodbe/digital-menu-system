<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distrito Carmen Menu Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=20260724-4">
</head>

<body>

    <!-- ==================================================
         HERO LAYOUT
         Pub Felix / rotating cocktail screens
         ================================================== -->

    <div id="hero-layout" class="menu-container">

        <!-- Crossfade Images -->
        <img
            id="cocktail-image-a"
            class="cocktail-image active"
            src=""
            alt=""
        >

        <img
            id="cocktail-image-b"
            class="cocktail-image"
            src=""
            alt=""
        >


        <!-- Background Video -->
        <video
            id="background-video"
            autoplay
            muted
            loop
            playsinline>
        </video>


        <!-- Overlay -->
        <div class="overlay"></div>


        <!-- Hero Content -->
        <div class="menu-content">

            <h1 id="cocktail-name"></h1>

            <p id="cocktail-description"></p>

            <div id="cocktail-price"></div>

        </div>


        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

    </div>


    <!-- ==================================================
         MENU BOARD LAYOUT
         Cocina
         ================================================== -->

    <div id="grid-layout">

        <!-- LEFT: MENU -->

        <section class="kitchen-menu">

            <header class="kitchen-header">

                <div class="kitchen-brand">
                  <img
                    id="kitchen-logo"
                    src=""
                    alt="Mercadito La California"
                  >
                </div>

            </header>


            <!--
                JavaScript will generate the five
                Cocina products inside this container.
            -->

            <div id="kitchen-items"></div>

        </section>


        <!-- RIGHT: ROTATING PHOTOS -->

        <section class="kitchen-media">

            <img
                id="kitchen-image-a"
                class="kitchen-image active"
                src=""
                alt=""
            >

            <img
                id="kitchen-image-b"
                class="kitchen-image"
                src=""
                alt=""
            >

        </section>

    </div>


    <!-- ==================================================
     JAVASCRIPT
     ================================================== -->

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

      <script src="js/config.js?v=20260724-2"></script>
      <script src="js/supabase.js?v=20260724-2"></script>
      <script src="js/api.js?v=20260724-4"></script>
      <script src="js/ui.js?v=20260724-2"></script>
      <script src="js/heartbeat.js?v=20260730-1"></script>
      <script src="js/player.js?v=20260724-3"></script>

</body>

</html>
